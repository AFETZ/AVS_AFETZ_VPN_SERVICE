name: afz-openflux
services:
  exit:
    build: .
    image: afz-openflux:a8a8937
    restart: unless-stopped
    env_file: ${OPENFLUX_ENV_FILE:-.env}
    # All capabilities and firewall rules apply only to this container's network namespace.
    # Never use network_mode: host or privileged: true here.
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:size=8m,noexec,nosuid"]
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    networks: [openflux]
networks:
  openflux:
    driver: bridge
