http:
  routers:
    xui-shop-http:
      rule: "(Host(`afzvpn.superbebra.uk`) || Host(`bot.superbebra.uk`) || Host(`yk.superbebra.uk`)) && (Path(`/webhook`) || Path(`/connection`) || Path(`/cryptomus`) || Path(`/heleket`) || Path(`/yookassa`) || Path(`/yoomoney`) || Path(`/geoip.dat`) || Path(`/geosite.dat`) || PathPrefix(`/sub/`) || PathPrefix(`/wl/`) || PathPrefix(`/wl-filtered/`))"
      entryPoints: [web]
      middlewares: [xui-shop-https-redirect]
      service: xui-shop-noop

    xui-shop:
      rule: "(Host(`afzvpn.superbebra.uk`) || Host(`bot.superbebra.uk`) || Host(`yk.superbebra.uk`)) && (Path(`/webhook`) || Path(`/connection`) || Path(`/cryptomus`) || Path(`/heleket`) || Path(`/yookassa`) || Path(`/yoomoney`) || Path(`/geoip.dat`) || Path(`/geosite.dat`) || PathPrefix(`/sub/`) || PathPrefix(`/wl/`) || PathPrefix(`/wl-filtered/`))"
      entryPoints: [websecure]
      tls:
        certResolver: le
      middlewares: [xui-shop-security]
      service: xui-shop

    xui-shop-direct-http:
      rule: "Host(`link.superbebra.uk`) && (Path(`/connection`) || Path(`/geoip.dat`) || Path(`/geosite.dat`) || PathPrefix(`/sub/`) || PathPrefix(`/wl/`) || PathPrefix(`/wl-filtered/`))"
      entryPoints: [web]
      middlewares: [xui-shop-https-redirect]
      service: xui-shop-noop

    xui-shop-link:
      rule: "Host(`link.superbebra.uk`) && (Path(`/connection`) || Path(`/geoip.dat`) || Path(`/geosite.dat`) || PathPrefix(`/sub/`) || PathPrefix(`/wl/`) || PathPrefix(`/wl-filtered/`))"
      entryPoints: [websecure]
      tls:
        certResolver: le
      middlewares: [xui-shop-security]
      service: xui-shop

  middlewares:
    xui-shop-https-redirect:
      redirectScheme:
        scheme: https
        permanent: true

    xui-shop-security:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        forceSTSHeader: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin

  services:
    xui-shop:
      loadBalancer:
        servers:
          - url: "http://172.22.0.1:8080"

    xui-shop-noop:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1"
