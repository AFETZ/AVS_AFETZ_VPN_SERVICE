x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "1"

services:
  traefik:
    image: "traefik:latest"
    container_name: "traefik"
    profiles:
      - legacy-traefik
    environment:
      - DOCKER_API_VERSION=1.45
    restart: always
    ports:
      - "80:80"
      - "8443:443"
    env_file:
      - .env
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt_data:/letsencrypt"
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--log.level=INFO"
    labels:
      - "traefik.enable=true"
    logging: *default-logging

  redis:
    image: redis:latest
    container_name: 3xui-shop-redis
    restart: always
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - ./.local/redis-data:/data
    logging: *default-logging

  bot:
    group_add:
      - "1000"
    cap_drop:
      - ALL
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    build: .
    container_name: 3xui-shop-bot
    network_mode: host
    volumes:
      - ./app/data:/app/data
      - ./plans.json:/app/data/plans.json
      - ./app/locales:/app/locales
      - ./app/logs:/app/logs
    env_file:
      - .env
    environment:
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6380
      - BOT_PROXY_URL=${BOT_PROXY_URL:-}
    stop_signal: SIGINT
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/readyz' % os.getenv('BOT_PORT', '8080'), timeout=3).read()\" >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: sh -c " 
      poetry run pybabel compile -d /app/locales -D bot && 
      poetry run alembic -c /app/db/alembic.ini upgrade head && 
      poetry run python /app/__main__.py"
    depends_on:
      - redis

volumes:
  redis_data:
  letsencrypt_data:
